name: Build H Protect APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create app
        run: |
          mkdir -p app/src/main/java/com/hprotect/app
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' } android { namespace 'com.hprotect.app'; compileSdk 34; defaultConfig { applicationId 'com.hprotect.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="H Protect"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf "package com.hprotect.app;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\nimport android.widget.TextView;\npublic class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); TextView tv=new TextView(this); tv.setText(\"H Protect - Installed\"); tv.setTextSize(24); setContentView(tv); } }" > app/src/main/java/com/hprotect/app/MainActivity.java
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: H-Protect-APK
          path: app/build/outputs/apk/debug/*.apk
